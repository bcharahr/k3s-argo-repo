replicaCount: 1

image:
  repository: pengbai/docker-supermario
  tag: latest
  pullPolicy: IfNotPresent

service:
  port: 80
  targetPort: 8080

ingress:
  enabled: true
  className: traefik
  host: mario.3aevolution.com
  clusterIssuer: "letsencrypt-cloudflare" # Set to the name of your cert-manager ClusterIssuer, if used.
  tls:
    enabled: true
    secretName: mario-tls

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 256Mi

# Secrets synced from Vault by the Vault Secrets Operator (VSO).
vault:
  enabled: true
  role: mario                 # Vault role at auth/kubernetes/role/mario
  mount: secret               # KV v2 mount
  path: mario/config          # -> secret/mario/config in Vault
  secretName: mario-config    # Kubernetes Secret VSO creates
  refreshAfter: 60s
