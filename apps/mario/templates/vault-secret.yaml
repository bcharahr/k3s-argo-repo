{{- if .Values.vault.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-vso
  labels:
    app.kubernetes.io/name: mario
    app.kubernetes.io/instance: {{ .Release.Name }}
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: {{ .Release.Name }}
  labels:
    app.kubernetes.io/name: mario
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  method: kubernetes
  mount: kubernetes
  kubernetes:
    role: {{ .Values.vault.role }}
    serviceAccount: {{ .Release.Name }}-vso
    audiences:
      - vault
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: {{ .Values.vault.secretName }}
  labels:
    app.kubernetes.io/name: mario
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  vaultAuthRef: {{ .Release.Name }}
  type: kv-v2
  mount: {{ .Values.vault.mount }}
  path: {{ .Values.vault.path }}
  refreshAfter: {{ .Values.vault.refreshAfter }}
  destination:
    name: {{ .Values.vault.secretName }}
    create: true
  rolloutRestartTargets:
    - kind: Deployment
      name: {{ .Release.Name }}
{{- end }}
